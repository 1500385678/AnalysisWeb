<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>AnalysisWeb</title>
<style>
:root {
  --bg: #fbfbfd;
  --text: #1d1d1f;
  --text-secondary: #6e6e73;
  --text-tertiary: #86868b;
  --border: rgba(0,0,0,0.08);
  --border-hover: rgba(0,0,0,0.16);
  --accent: #0071e3;
  --accent-hover: #0077ed;
  --accent-soft: rgba(0,113,227,0.12);
  --card-bg: #ffffff;
  --header-bg: rgba(251,251,253,0.72);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
  --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
  --shadow-lg: 0 16px 40px rgba(0,0,0,0.12);
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --radius: 14px;
  --radius-lg: 20px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -0.01em;
}

/* ============== Header (磨砂玻璃 · 单行极简) ============== */
header {
  background: var(--header-bg);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  padding: 6px 14px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: nowrap;
  overflow: hidden;
}

h1 {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--text);
  flex: 0 0 auto;
  white-space: nowrap;
  margin: 0;
}

.search-box {
  display: flex;
  gap: 3px;
  align-items: center;
  flex-wrap: nowrap;
  flex: 1 1 auto;
  min-width: 0;
}

.search-box input,
.search-box select {
  background: rgba(255,255,255,0.5);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 3px 9px;
  border-radius: 6px;
  font-size: 11.5px;
  font-family: inherit;
  transition: all 0.2s var(--ease);
  outline: none;
  flex: 0 0 auto;
  height: 24px;
}

.search-box select { width: 62px; min-width: 0; }
.search-box input#q { width: 140px; }

.search-box input:focus,
.search-box select:focus {
  border-color: var(--accent);
  background: #fff;
  box-shadow: 0 0 0 2px var(--accent-soft);
}

.search-box button {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 3px 11px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 11.5px;
  font-weight: 500;
  font-family: inherit;
  transition: all 0.2s var(--ease);
  white-space: nowrap;
  flex: 0 0 auto;
  height: 24px;
}

.search-box button:hover {
  background: var(--accent-hover);
}

/* 2026-08-06 P1:9 维承诺不再空头 - 6 个新维度独立一行,跟 search-box 风格一致 */
.dim-row {
  display: flex;
  gap: 3px;
  align-items: center;
  flex-wrap: wrap;
  flex: 0 0 auto;
  margin-top: 4px;
  padding-left: 2px;
}
.dim-row select {
  background: rgba(255,255,255,0.4);
  border: 1px dashed var(--border);
  color: var(--text);
  padding: 3px 9px;
  border-radius: 6px;
  font-size: 11px;
  font-family: inherit;
  outline: none;
  height: 22px;
  cursor: pointer;
}
.dim-row select:focus,
.dim-row select:hover {
  border-color: var(--accent);
  background: #fff;
}
.dim-row .dim-label {
  font-size: 11px;
  color: var(--text-soft);
  margin-right: 4px;
}

.btn-secondary {
  background: rgba(0,0,0,0.05) !important;
  color: var(--text) !important;
}

.btn-secondary:hover {
  background: rgba(0,0,0,0.08) !important;
}

.btn-toggle {
  background: rgba(0,0,0,0.05) !important;
  color: var(--text) !important;
}

.btn-toggle.active {
  background: #ff3b30 !important;
  color: #fff !important;
}

/* ============== Keywords (与 search-box 同行) ============== */
.keywords-box {
  display: flex;
  flex-wrap: nowrap;
  gap: 3px;
  align-items: center;
  flex: 0 0 auto;
  overflow: hidden;
  white-space: nowrap;
  max-width: 200px;
}

.keywords-box > span { display: none; }

.kw-tag {
  background: var(--accent);
  color: #fff;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 10.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s var(--ease);
  flex: 0 0 auto;
}

.kw-tag:hover { background: #ff3b30; }

#kw-input {
  background: rgba(255,255,255,0.5) !important;
  border: 1px solid var(--border) !important;
  border-radius: 6px !important;
  padding: 3px 8px !important;
  font-size: 11px !important;
  width: 110px !important;
  color: var(--text) !important;
  font-family: inherit !important;
  outline: none;
  height: 24px !important;
}

#kw-input:focus {
  border-color: var(--accent) !important;
  background: #fff !important;
  box-shadow: 0 0 0 2px var(--accent-soft);
}

/* ============== Tabs ============== */
.tab-bar {
  display: inline-flex;
  gap: 1px;
  background: rgba(0,0,0,0.05);
  border-radius: 6px;
  padding: 1px;
  flex: 0 0 auto;
}

.tab {
  background: transparent !important;
  color: var(--text-secondary) !important;
  padding: 2px 9px !important;
  border-radius: 4px !important;
  cursor: pointer;
  font-size: 11px;
  font-weight: 500;
  transition: all 0.2s var(--ease);
  height: 20px;
  display: inline-flex;
  align-items: center;
}

.tab:hover { color: var(--text); }

.tab.active {
  background: #fff !important;
  color: var(--text) !important;
  box-shadow: var(--shadow-sm);
}

/* ============== Facets (v2.0.7: 隐藏,让图面更满) ============== */
.facets { display: none; }

.facet-group {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.facet-label {
  color: var(--text-secondary);
  font-weight: 500;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.facet-chip {
  background: rgba(0,0,0,0.05);
  color: var(--text);
  padding: 4px 12px;
  border-radius: 980px;
  cursor: pointer;
  transition: all 0.2s var(--ease);
  font-size: 12px;
  font-weight: 500;
}

.facet-chip:hover {
  background: rgba(0,0,0,0.1);
  transform: translateY(-1px);
}

.facet-chip.active {
  background: var(--accent);
  color: #fff;
}

/* ============== Main (v2.0.7: 满屏,不再 max-width 居中) ============== */
.main {
  padding: 24px 24px 40px;
  max-width: none;
  width: 100%;
}

.result-meta {
  color: var(--text-secondary);
  font-size: 14px;
  margin-bottom: 16px;
  font-weight: 500;
  letter-spacing: -0.01em;
}

/* ============== Grid & Cards (v2.0.7: 卡更小,多列,更满) ============== */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}

.card {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  overflow: hidden;
  cursor: pointer;
  transition: all 0.35s var(--ease);
  position: relative;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border);
  animation: slideUp 0.5s var(--ease) backwards;
}

.card:nth-child(1) { animation-delay: 0.02s; }
.card:nth-child(2) { animation-delay: 0.04s; }
.card:nth-child(3) { animation-delay: 0.06s; }
.card:nth-child(4) { animation-delay: 0.08s; }
.card:nth-child(5) { animation-delay: 0.10s; }
.card:nth-child(6) { animation-delay: 0.12s; }
.card:nth-child(7) { animation-delay: 0.14s; }
.card:nth-child(8) { animation-delay: 0.16s; }
.card:nth-child(9) { animation-delay: 0.18s; }
.card:nth-child(10) { animation-delay: 0.20s; }

.card:hover {
  transform: translateY(-6px) scale(1.01);
  box-shadow: var(--shadow-lg);
  border-color: var(--border-hover);
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  display: block;
  background: #f0f0f0;
  transition: transform 0.6s var(--ease);
}

.card:hover img { transform: scale(1.06); }

.card-body {
  padding: 14px 16px;
  font-size: 12px;
  color: var(--text-secondary);
}

.card-title {
  color: var(--text);
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 6px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  letter-spacing: -0.01em;
}

.tags {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-top: 6px;
}

.tag {
  background: rgba(0,0,0,0.05);
  color: var(--text-secondary);
  padding: 2px 9px;
  border-radius: 980px;
  font-size: 10px;
  font-weight: 500;
}

.fav-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  background: rgba(255,255,255,0.9);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  border: none;
  color: var(--text-secondary);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 18px;
  transition: all 0.2s var(--ease);
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  justify-content: center;
}

.fav-btn:hover {
  background: #fff;
  transform: scale(1.1);
}

.fav-btn.active { color: #ff3b30; }

.sim-badge {
  position: absolute;
  top: 12px;
  left: 12px;
  background: rgba(0,0,0,0.75);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  color: #fff;
  padding: 4px 12px;
  border-radius: 980px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
}

.view-badge {
  position: absolute;
  bottom: 12px;
  left: 12px;
  background: rgba(255,255,255,0.92);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  color: var(--text);
  padding: 3px 11px;
  border-radius: 980px;
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

/* ============== Modal ============== */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.88);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 32px;
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
}

.modal.open {
  display: flex;
  animation: fadeIn 0.3s var(--ease);
}

.modal img {
  max-width: 90%;
  max-height: 80vh;
  object-fit: contain;
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  animation: scaleIn 0.3s var(--ease);
}

.modal-info {
  color: rgba(255,255,255,0.9);
  margin-top: 16px;
  max-width: 90%;
  font-size: 14px;
}

.modal-close {
  position: fixed;
  top: 24px;
  right: 32px;
  color: #fff;
  font-size: 24px;
  cursor: pointer;
  background: rgba(255,255,255,0.1);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  border: none;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  transition: all 0.2s var(--ease);
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-close:hover {
  background: rgba(255,255,255,0.2);
  transform: scale(1.1);
}

/* ============== Upload ============== */
.upload-area {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.88);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  -webkit-backdrop-filter: blur(20px);
  backdrop-filter: blur(20px);
}

.upload-area.open {
  display: flex;
  animation: fadeIn 0.3s var(--ease);
}

.upload-box {
  border: 2px dashed rgba(255,255,255,0.3);
  border-radius: var(--radius-lg);
  padding: 80px;
  text-align: center;
  color: rgba(255,255,255,0.7);
  background: rgba(255,255,255,0.05);
  transition: all 0.25s var(--ease);
}

.upload-box.dragover {
  border-color: var(--accent);
  color: #fff;
  background: rgba(0,113,227,0.1);
  transform: scale(1.02);
}

.upload-box input { display: none; }

/* ============== Loading ============== */
.loading {
  color: var(--text-secondary);
  padding: 60px;
  text-align: center;
  font-size: 15px;
}

/* ============== Intent Panel (AI 找参考) ============== */
.intent-panel {
  padding: 32px;
  max-width: 1600px;
  margin: 0 auto;
  background: var(--bg);
  min-height: calc(100vh - 100px);
}

.intent-input-wrap {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
  animation: slideUp 0.4s var(--ease);
}

.intent-input-wrap textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  font-family: inherit;
  font-size: 14px;
  line-height: 1.6;
  color: var(--text);
  background: rgba(255,255,255,0.6);
  resize: vertical;
  outline: none;
  transition: all 0.2s var(--ease);
  box-sizing: border-box;
}

.intent-input-wrap textarea:focus {
  border-color: var(--accent);
  background: #fff;
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.intent-actions {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 12px;
}

.btn-primary {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 8px 22px;
  border-radius: 980px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  transition: all 0.2s var(--ease);
  flex: 0 0 auto;
}

.btn-primary:hover {
  background: var(--accent-hover);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(0,113,227,0.3);
}

.intent-hint {
  color: var(--text-tertiary);
  font-size: 12px;
  flex: 1 1 auto;
}

.intent-results {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.intent-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  display: flex;
  gap: 0;
  transition: all 0.3s var(--ease);
  animation: slideUp 0.5s var(--ease) backwards;
}

.intent-card:nth-child(1) { animation-delay: 0.05s; }
.intent-card:nth-child(2) { animation-delay: 0.10s; }
.intent-card:nth-child(3) { animation-delay: 0.15s; }
.intent-card:nth-child(4) { animation-delay: 0.20s; }
.intent-card:nth-child(5) { animation-delay: 0.25s; }

.intent-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
}

.intent-card-img {
  flex: 0 0 320px;
  height: 240px;
  background: #f0f0f0;
  cursor: pointer;
  overflow: hidden;
}

.intent-card-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.4s var(--ease);
}

.intent-card-img:hover img {
  transform: scale(1.04);
}

.intent-card-body {
  flex: 1 1 auto;
  padding: 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}

.intent-card-rank {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.intent-card-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.01em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.intent-card-caption {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.intent-reasons {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 4px;
}

.intent-reason-chip {
  background: rgba(0,113,227,0.08);
  color: var(--accent);
  padding: 3px 10px;
  border-radius: 980px;
  font-size: 11px;
  font-weight: 500;
}

.intent-card-actions {
  margin-top: auto;
  display: flex;
  gap: 8px;
  align-items: center;
}

.btn-variant {
  background: rgba(0,0,0,0.05);
  color: var(--text);
  border: none;
  padding: 5px 14px;
  border-radius: 980px;
  cursor: pointer;
  font-size: 11.5px;
  font-weight: 500;
  font-family: inherit;
  transition: all 0.2s var(--ease);
}

.btn-variant:hover {
  background: var(--accent);
  color: #fff;
}

.btn-variant:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.intent-variant-result {
  margin-top: 12px;
  padding: 12px;
  background: rgba(0,0,0,0.03);
  border-radius: 12px;
  font-size: 12px;
  color: var(--text-secondary);
  min-height: 40px;
}

.intent-variant-result img {
  max-width: 100%;
  border-radius: 8px;
  margin-top: 8px;
}

/* ============== Animations ============== */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.92); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<header>
  <h1>AnalysisWeb</h1>
  <div class="search-box">
    <input id="q" type="text" placeholder="搜索关键词，如：黄昏鸟瞰、住宅、教堂..." autofocus>
    <select id="project" data-label="项目"><option value=""></option></select>
    <select id="scene" data-label="场景"><option value=""></option></select>
    <select id="light" data-label="光线"><option value=""></option></select>
    <select id="mood" data-label="氛围"><option value=""></option></select>
    <select id="arch" data-label="类型"><option value=""></option></select>
    <select id="company" data-label="公司"><option value=""></option></select>
    <select id="view" data-label="视角"><option value=""></option></select>
    <button onclick="search()">搜索</button>
    <button class="btn-secondary" onclick="openUpload()">上传搜图</button>
    <button class="btn-toggle" id="fav-toggle" onclick="toggleFavMode()">★ 收藏</button>
  </div>
  <!-- 2026-08-06 P1:9 维承诺第 2~7 维(分析类型/画法/主题/尺度/渲染/配色),独立行虚线 chip 风格 -->
  <div class="dim-row">
    <span class="dim-label">9 维:</span>
    <select id="analysis_type" data-label="分析类型"><option value=""></option></select>
    <select id="drawing_method" data-label="画法"><option value=""></option></select>
    <select id="subject" data-label="主题"><option value=""></option></select>
    <select id="scale" data-label="尺度"><option value=""></option></select>
    <select id="render_style" data-label="渲染"><option value=""></option></select>
    <select id="color_palette" data-label="配色"><option value=""></option></select>
  </div>
  <div class="keywords-box" id="kw-box">
    <span style="color:#888;font-size:12px">多关键词：</span>
    <input id="kw-input" type="text" placeholder="搜索" style="background:#1a1a1a;border:1px solid #3a3a3a;color:#eaeaea;padding:4px 10px;border-radius:12px;font-size:12px;width:200px">
  </div>
  <div class="tab-bar">
    <div class="tab active" data-mode="normal" onclick="setMode('normal')">普通搜</div>
    <div class="tab" data-mode="sim" onclick="setMode('sim')">相似图</div>
    <div class="tab" data-mode="sem" onclick="setMode('sem')">AI 语义</div>
    <div class="tab" data-mode="intent" onclick="setMode('intent')">AI 找参考</div>
  </div>
</header>
<div class="facets" id="facets"></div>
<div class="main">
  <div class="result-meta" id="meta">输入关键词开始搜索</div>
  <div class="grid" id="grid"></div>
</div>
<div class="intent-panel" id="intent-panel" style="display:none">
  <div class="intent-input-wrap">
    <textarea id="intent-input" rows="3" placeholder="用自然语言描述你的设计想法。例如:&#10;我想做一个轻盈的山地教堂,800 平,混凝土结构,跟山体融合,夜景氛围"></textarea>
    <div class="intent-actions">
      <button class="btn-primary" onclick="searchIntent()">找参考</button>
      <span class="intent-hint" id="intent-hint">↑ 描述场地/体量/材料/氛围/光,AI 会匹配 5 个最相关的案例 + 解释为什么像</span>
    </div>
  </div>
  <div class="intent-results" id="intent-results"></div>
</div>
<div class="modal" id="modal" onclick="closeModal()">
  <button class="modal-close">×</button>
  <div style="text-align:center">
    <img id="modal-img">
    <div class="modal-info" id="modal-info"></div>
  </div>
</div>
<div class="upload-area" id="upload-area" onclick="if(event.target===this)closeUpload()">
  <div class="upload-box" id="drop-zone">
    <p style="font-size:18px;margin-bottom:12px">拖拽图片到此处，或</p>
    <label style="background:#ff9e4a;color:#fff;padding:8px 20px;border-radius:4px;cursor:pointer">
      选择文件
      <input type="file" accept="image/*" onchange="handleFile(this.files[0])">
    </label>
  </div>
  <p style="color:#888;margin-top:16px">基于 phash 找视觉相似图（无 AI 嵌入）</p>
</div>

<script>
let facets = {};
let keywords = [];
let favs = [];
let mode = 'normal';
let favOnlyMode = false;

async function init() {
  const r = await fetch('/api/facets');
  facets = await r.json();
  fillSelect('project', facets.projects);
  fillSelect('arch', facets.archs || []);
  fillSelect('company', facets.companies || []);
  // 2026-08-08 Verifier P1 修复:view_types facets 改 DB 实时 DISTINCT 中文值,直接显示,不再三语硬编码
  // (AGENTS.md §4 表 view_type 示例:鸟瞰/透视/剖切/轴测;DB tag_images.py 写入也是中文)
  fillSelect('view', (facets.view_types || []).map(v => ({value: v, label: v})));
  fillSelect('scene', facets.scenes);
  fillSelect('light', facets.lights);
  fillSelect('mood', facets.moods);
  // 2026-08-06 P1:9 维承诺不再空头 - 6 个新维度 chips
  fillSelect('analysis_type', facets.analysis_types || []);
  fillSelect('drawing_method', facets.drawing_methods || []);
  fillSelect('subject', facets.subjects || []);
  fillSelect('scale', facets.scales || []);
  fillSelect('render_style', facets.render_styles || []);
  fillSelect('color_palette', facets.color_palettes || []);
  const fr = await fetch('/api/favorites');
  const fd = await fr.json();
  favs = fd.favorites;
  updateFavBtns();
  search();
}

function fillSelect(id, items) {
  const sel = document.getElementById(id);
  sel.innerHTML = '<option value="">' + (sel.dataset.label || '全部') + '</option>';
  items.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v.length > 20 ? v.substring(0, 20) + '…' : v;
    sel.appendChild(opt);
  });
}

function renderKeywords() {
  const box = document.getElementById('kw-box');
  // keep label + input
  Array.from(box.querySelectorAll('.kw-tag')).forEach(n => n.remove());
  keywords.forEach((k, i) => {
    const t = document.createElement('span');
    t.className = 'kw-tag';
    t.textContent = k + ' ×';
    t.onclick = () => { keywords.splice(i, 1); renderKeywords(); search(); };
    box.insertBefore(t, document.getElementById('kw-input'));
  });
}

document.getElementById('kw-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.value.trim()) {
    keywords.push(e.target.value.trim());
    e.target.value = '';
    renderKeywords();
    search();
  }
});

function updateFavBtns() {
  document.querySelectorAll('.fav-btn').forEach(btn => {
    const id = parseInt(btn.dataset.id);
    btn.classList.toggle('active', favs.includes(id));
  });
}

async function toggleFav(id) {
  const r = await fetch('/api/favorites', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({id})
  });
  const d = await r.json();
  favs = d.favorites;
  updateFavBtns();
  if (favOnlyMode) search();
}

function toggleFavMode() {
  favOnlyMode = !favOnlyMode;
  document.getElementById('fav-toggle').classList.toggle('active', favOnlyMode);
  search();
}

function setMode(m) {
  mode = m;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === m));
  document.getElementById('q').placeholder = m === 'sim' ? 'phash 视觉相似需要上传图...' : (m === 'sem' ? 'AI 语义搜：输入"黄昏鸟瞰住宅"自动找相似图...' : '搜索关键词...');

  // 2026-07-24 v2.0.6: AI 找参考 模式 切换 intent-panel 显示
  const intentPanel = document.getElementById('intent-panel');
  const mainEl = document.querySelector('.main');
  const facetsEl = document.getElementById('facets');
  if (m === 'intent') {
    intentPanel.style.display = 'block';
    mainEl.style.display = 'none';
    facetsEl.style.display = 'none';
  } else {
    intentPanel.style.display = 'none';
    mainEl.style.display = 'block';
    facetsEl.style.display = 'flex';
  }
}

async function searchIntent() {
  const intent = document.getElementById('intent-input').value.trim();
  if (!intent) {
    document.getElementById('intent-hint').textContent = '⚠️ 请输入你的设计意图';
    return;
  }
  document.getElementById('intent-hint').textContent = '↑ 描述场地/体量/材料/氛围/光,AI 会匹配 5 个最相关的案例 + 解释为什么像';

  const results = document.getElementById('intent-results');
  results.innerHTML = '<div class="loading">匹配中…</div>';

  const r = await fetch('/api/intent_search', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({intent}),
  });
  const data = await r.json();

  if (data.error) {
    results.innerHTML = '<div class="loading">⚠️ ' + data.error + '</div>';
    return;
  }
  if (!data.items || data.items.length === 0) {
    results.innerHTML = '<div class="loading">没找到匹配案例,试试更宽泛的描述</div>';
    return;
  }

  results.innerHTML = '';
  data.items.forEach(item => {
    // 2026-08-10 P0 修复(R83):改 createElement + dataset 传值,根治 XSS 注入
    // 之前 onclick= 字符串拼接 item 字段(item.caption / project / url),caption 含 " 或 '
    // 或 filename 含 <script> 直接破 HTML;改用 dataset.item + addEventListener,杜绝字符串拼接
    const card = document.createElement('div');
    card.className = 'intent-card';
    const safeItem = {
      url: item.url, filename: item.filename, project: item.project,
      caption: item.caption, scene: item.scene, light: item.light,
      material: item.material, mood: item.mood, path: item.path, id: item.id,
    };
    card.dataset.item = JSON.stringify(safeItem);

    const imgWrap = document.createElement('div');
    imgWrap.className = 'intent-card-img';
    imgWrap.addEventListener('click', () => openModal(JSON.parse(card.dataset.item)));
    const img = document.createElement('img');
    img.src = item.url;
    img.addEventListener('error', () => { img.style.opacity = 0.3; });
    imgWrap.appendChild(img);

    const body = document.createElement('div');
    body.className = 'intent-card-body';

    const rank = document.createElement('div');
    rank.className = 'intent-card-rank';
    rank.textContent = `匹配 #${item.rank} · ${item.project}`;
    body.appendChild(rank);

    const title = document.createElement('div');
    title.className = 'intent-card-title';
    title.textContent = item.caption || item.filename || '';
    body.appendChild(title);

    const capDiv = document.createElement('div');
    capDiv.className = 'intent-card-caption';
    body.appendChild(capDiv);

    const reasons = document.createElement('div');
    reasons.className = 'intent-reasons';
    (item.reasons || []).forEach(re => {
      const chip = document.createElement('span');
      chip.className = 'intent-reason-chip';
      chip.textContent = re;
      reasons.appendChild(chip);
    });
    body.appendChild(reasons);

    const actions = document.createElement('div');
    actions.className = 'intent-card-actions';
    const vBtn = document.createElement('button');
    vBtn.className = 'btn-variant';
    vBtn.textContent = '✨ 生图变体(MCP)';
    vBtn.addEventListener('click', e => generateVariant(item.id, vBtn));
    actions.appendChild(vBtn);
    const mBtn = document.createElement('button');
    mBtn.className = 'btn-variant';
    mBtn.textContent = '查看大图';
    mBtn.addEventListener('click', () => openModal(JSON.parse(card.dataset.item)));
    actions.appendChild(mBtn);
    body.appendChild(actions);

    const variant = document.createElement('div');
    variant.className = 'intent-variant-result';
    variant.id = `variant-${item.id}`;
    body.appendChild(variant);

    card.appendChild(imgWrap);
    card.appendChild(body);
    results.appendChild(card);
  });
}

async function generateVariant(itemId, btn) {
  const target = document.getElementById('variant-' + itemId);
  if (!target) return;
  const origText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '⏳ 生成中…';
  target.innerHTML = '<div style="color:var(--text-tertiary)">调 matrix MCP 生成变体…</div>';

  // 找到该 item 的 prompt_hint
  const cards = document.querySelectorAll('.intent-card');
  let promptHint = '';
  const intent = document.getElementById('intent-input').value.trim();
  // 用 intent + 后端给的 prompt_hint(从后端响应里拿不到,前端再 fetch 一次或直接用 intent 拼)
  // 简化:用 intent 作为 prompt,后端会基于 metadata 自动给变体
  promptHint = intent;

  try {
    const r = await fetch('/api/ai_image', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({prompt: promptHint, aspect_ratio: '3:2', resolution: '2K'}),
    });
    const data = await r.json();
    if (data.error) {
      target.innerHTML = '<div style="color:#ff3b30">⚠️ ' + data.error + '</div>';
    } else if (data.path) {
      target.innerHTML = '<div style="color:var(--accent);font-weight:500">✅ 已生成</div><img src="' + data.path + '" style="max-width:100%;border-radius:8px;margin-top:8px">';
    } else {
      target.innerHTML = '<div style="color:#ff3b30">⚠️ 未知响应</div>';
    }
  } catch (e) {
    target.innerHTML = '<div style="color:#ff3b30">⚠️ ' + e.message + '</div>';
  } finally {
    btn.disabled = false;
    btn.textContent = origText;
  }
}

async function search() {
  const q = document.getElementById('q').value;
  const project = document.getElementById('project').value;
  const scene = document.getElementById('scene').value;
  const light = document.getElementById('light').value;
  const mood = document.getElementById('mood').value;
  const arch = document.getElementById('arch').value;
  const company = document.getElementById('company').value;
  const view = document.getElementById('view').value;
  // 2026-08-06 P1:6 个新维度查询参数
  const analysis_type = document.getElementById('analysis_type').value;
  const drawing_method = document.getElementById('drawing_method').value;
  const subject = document.getElementById('subject').value;
  const scale = document.getElementById('scale').value;
  const render_style = document.getElementById('render_style').value;
  const color_palette = document.getElementById('color_palette').value;
  const grid = document.getElementById('grid');
  const meta = document.getElementById('meta');
  grid.innerHTML = '<div class="loading">搜索中…</div>';

  if (mode === 'sem' && q) {
    const r = await fetch('/api/semantic_search?q=' + encodeURIComponent(q));
    const data = await r.json();
    meta.textContent = 'AI 语义搜 "' + q + '" → ' + data.count + ' 张结果';
    renderCards(data.items);
    return;
  }

  const params = new URLSearchParams();
  if (q) params.set('q', q);
  if (keywords.length) params.set('keywords', keywords.join(','));
  if (project) params.set('project', project);
  if (scene) params.set('scene', scene);
  if (light) params.set('light', light);
  if (mood) params.set('mood', mood);
  if (arch) params.set('arch', arch);
  if (company) params.set('company', company);
  if (view) params.set('view', view);
  // 2026-08-06 P1:6 个新维度传参
  if (analysis_type) params.set('analysis_type', analysis_type);
  if (drawing_method) params.set('drawing_method', drawing_method);
  if (subject) params.set('subject', subject);
  if (scale) params.set('scale', scale);
  if (render_style) params.set('render_style', render_style);
  if (color_palette) params.set('color_palette', color_palette);
  if (favOnlyMode) params.set('favs_only', '1');
  const r = await fetch('/api/search?' + params);
  const data = await r.json();
  meta.textContent = '共 ' + data.count + ' 张结果' + (favOnlyMode ? '（收藏夹）' : '') + (keywords.length ? ' | 关键词: ' + keywords.join(', ') : '');
  renderCards(data.items);
}

function renderCards(items) {
  const grid = document.getElementById('grid');
  if (!items || items.length === 0) {
    grid.innerHTML = '<div class="loading">无匹配结果</div>';
    return;
  }
  grid.innerHTML = '';
  items.forEach(item => {
    // 2026-08-10 P0 修复(R83):renderCards + openModal 全改 createElement + textContent,
    // 杜绝 item.filename / project / scene / path 含 " ' < > 时破 innerHTML 触发 XSS;
    // 之前 line 1180-1184 / 1195-1201 模板字符串拼接全是攻击面。
    const card = document.createElement('div');
    card.className = 'card';
    if (item.similarity !== undefined) {
      const sim = document.createElement('div');
      sim.className = 'sim-badge';
      sim.textContent = `相似 ${item.similarity}%`;
      card.appendChild(sim);
    }
    // 2026-08-08 Verifier P1 修复:view_badge 直接用 DB 中文值(鸟瞰/透视/剖切/轴测),
    // 不再三元硬编码 bird-eye/eye-level/other
    if (item.view_type) {
      const vb = document.createElement('div');
      vb.className = 'view-badge';
      vb.textContent = item.view_type;
      card.appendChild(vb);
    }
    const favBtn = document.createElement('button');
    favBtn.className = 'fav-btn ' + (favs.includes(item.id) ? 'active' : '');
    favBtn.dataset.id = item.id;
    favBtn.textContent = favs.includes(item.id) ? '★' : '☆';
    favBtn.addEventListener('click', e => { e.stopPropagation(); toggleFav(item.id); });
    card.appendChild(favBtn);
    const img = document.createElement('img');
    img.src = item.url;
    img.addEventListener('error', () => { img.style.opacity = 0.3; });
    card.appendChild(img);
    const body = document.createElement('div');
    body.className = 'card-body';
    const title = document.createElement('div');
    title.className = 'card-title';
    title.textContent = item.filename || '';
    body.appendChild(title);
    const proj = document.createElement('div');
    proj.textContent = item.project || '';
    body.appendChild(proj);
    const tags = document.createElement('div');
    tags.className = 'tags';
    (item.scene || '').split(';').map(t => t.trim()).filter(Boolean).slice(0, 3).forEach(t => {
      const s = document.createElement('span');
      s.className = 'tag';
      s.textContent = t;
      tags.appendChild(s);
    });
    body.appendChild(tags);
    card.appendChild(body);
    card.addEventListener('click', () => openModal(item));
    grid.appendChild(card);
  });
}

function openModal(item) {
  document.getElementById('modal-img').src = item.url;
  const info = document.getElementById('modal-info');
  info.innerHTML = '';  // 清空再 appendChild,所有文本走 textContent
  const fn = document.createElement('div');
  fn.style.cssText = 'font-size:18px;color:#fff;margin-bottom:8px';
  fn.textContent = item.filename || '';
  info.appendChild(fn);
  const proj = document.createElement('div');
  proj.textContent = '项目: ' + (item.project || '-');
  info.appendChild(proj);
  const ctx1 = document.createElement('div');
  ctx1.textContent = `场景: ${item.scene||'-'} | 光线: ${item.light||'-'} | 氛围: ${item.mood||'-'}`;
  info.appendChild(ctx1);
  const ctx2 = document.createElement('div');
  ctx2.textContent = `空间: ${item.space||'-'} | 材料: ${item.material||'-'}`;
  info.appendChild(ctx2);
  const path = document.createElement('div');
  path.style.cssText = 'color:#888;margin-top:6px';
  path.textContent = '路径: ' + (item.path || '');
  info.appendChild(path);
  const isFav = favs.includes(item.id);
  const favBtn = document.createElement('button');
  favBtn.className = 'fav-btn ' + (isFav ? 'active' : '');
  favBtn.style.cssText = 'position:static;width:auto;padding:6px 14px;border-radius:4px;margin-top:8px';
  favBtn.textContent = isFav ? '★ 取消收藏' : '☆ 收藏';
  favBtn.addEventListener('click', () => {
    toggleFav(item.id);
    const nowFav = favs.includes(item.id);
    favBtn.textContent = nowFav ? '★ 取消收藏' : '☆ 收藏';
    favBtn.className = 'fav-btn ' + (nowFav ? 'active' : '');
  });
  info.appendChild(favBtn);
  document.getElementById('modal').classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

function openUpload() {
  document.getElementById('upload-area').classList.add('open');
  document.getElementById('drop-zone').classList.remove('dragover');
}
function closeUpload() { document.getElementById('upload-area').classList.remove('open'); }

const dropZone = document.getElementById('drop-zone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});

async function handleFile(f) {
  if (!f) return;
  const b64 = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => res(e.target.result);
    r.onerror = rej;
    r.readAsDataURL(f);
  });
  const grid = document.getElementById('grid');
  const meta = document.getElementById('meta');
  grid.innerHTML = '<div class="loading">上传中…</div>';
  const r = await fetch('/api/upload_search', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({image: b64})
  });
  const data = await r.json();
  closeUpload();
  meta.textContent = '上传图 ' + (f.name||'') + ' → 共 ' + data.count + ' 张相似图';
  if (data.error) {
    grid.innerHTML = '<div class="loading">' + data.error + '</div>';
    return;
  }
  // 复用 search 渲染
  grid.innerHTML = '';
  data.items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    const tagsHtml = (item.scene||'').split(';').map(t=>t.trim()).filter(Boolean).slice(0,3).map(t=>`<span class="tag">${t}</span>`).join('');
    card.innerHTML = `
      <div class="sim-badge">相似 ${item.similarity}%</div>
      <img src="${item.url}">
      <div class="card-body">
        <div class="card-title">${item.filename}</div>
        <div>${item.project}</div>
        <div class="tags">${tagsHtml}</div>
      </div>
    `;
    card.onclick = () => openModal(item);
    grid.appendChild(card);
  });
}

document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
document.querySelectorAll('select').forEach(s => s.addEventListener('change', search));
init();
</script>
</body>
</html>
